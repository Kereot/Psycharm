{# Одно поле формы: подпись, поле, подсказка и ошибки. Ожидает переменную field. #}
<div class="field">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
    {{ field }}
    {% if field.help_text %}
        <div class="form-text" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>
    {% endif %}
    {% if field.errors %}
        <div class="field-errors">{{ field.errors }}</div>
    {% endif %}
</div>
