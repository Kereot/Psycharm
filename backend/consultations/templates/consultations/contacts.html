{% extends "base.html" %}

{% block title %}Свяжитесь с нами{% endblock %}

{% block content %}
<div class="alert alert-warning">
    <h1 class="h4">Не удалось отправить заявку автоматически</h1>
    <p>Пожалуйста, свяжитесь с нами напрямую:</p>
    <ul class="mb-0">
        {% if contact_email %}
            <li>Email: {{ contact_email }}</li>
        {% endif %}
    </ul>
</div>

<a href="{% url 'pages:home' %}" class="btn btn-outline-primary">На главную</a>
{% endblock %}
