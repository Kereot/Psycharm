{% extends "base.html" %}

{% block title %}Заявки на консультацию{% endblock %}

{% block content %}
<div class="page-head">
    <h1>Заявки на консультацию</h1>
</div>

<div id="consultations-app" aria-live="polite">
    <p class="empty">Загрузка…</p>
</div>

<script>
const STATUS_LABELS = {new: 'Новая', in_progress: 'В работе', closed: 'Закрыта'};
const CONTACT_LABELS = {phone: 'Телефон', email: 'Email', telegram: 'Telegram', whatsapp: 'WhatsApp'};

function getCookie(name) {
    const match = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
    return match ? decodeURIComponent(match.pop()) : '';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text ?? '';
    return div.innerHTML;
}

async function loadConsultations(url) {
    const root = document.getElementById('consultations-app');
    try {
        const response = await fetch(url);
        if (!response.ok) {
            root.innerHTML = '<div class="alert alert-danger">Не удалось загрузить заявки.</div>';
            return;
        }
        const data = await response.json();
        renderTable(data);
    } catch (error) {
        root.innerHTML = '<div class="alert alert-danger">Ошибка сети при загрузке заявок.</div>';
    }
}

function groupByContact(items) {
    const groups = new Map();
    for (const item of items) {
        const key = `${item.contact_method}:${item.contact_value}`;
        if (!groups.has(key)) {
            groups.set(key, []);
        }
        groups.get(key).push(item);
    }
    return Array.from(groups.values());
}

function renderTable(data) {
    const root = document.getElementById('consultations-app');
    const items = data.results;

    if (!items.length) {
        root.innerHTML = '<p class="empty">Заявок пока нет.</p>';
        return;
    }

    const options = Object.entries(STATUS_LABELS)
        .map(([value, label]) => `<option value="${value}">${label}</option>`)
        .join('');

    const groups = groupByContact(items);

    const rows = groups.map((group, groupIndex) => {
        const rowClass = groupIndex % 2 ? 'table-light' : '';
        const groupBadge = group.length > 1
            ? `<span class="tag tag--count" title="Заявок с этим контактом на этой странице: ${group.length}">×${group.length}</span>`
            : '';

        return group.map((item, indexInGroup) => `
            <tr data-id="${item.id}" class="${rowClass}" role="row">
                <td role="cell" data-label="Имя">
                    ${escapeHtml(item.name)}
                    ${item.notification_failed ? '<span class="tag tag--warn" title="Не удалось уведомить ни email, ни Telegram">Уведомление не дошло</span>' : ''}
                </td>
                <td role="cell" data-label="Контакт">${escapeHtml(CONTACT_LABELS[item.contact_method] || item.contact_method)}: ${escapeHtml(item.contact_value)}${indexInGroup === 0 ? groupBadge : ''}</td>
                <td role="cell" data-label="Сообщение" class="cell-text">${escapeHtml(item.message)}</td>
                <td role="cell" data-label="Создана" class="cell-date">${new Date(item.created_at).toLocaleString('ru-RU', {dateStyle: 'medium', timeStyle: 'short'})}</td>
                <td role="cell" data-label="Статус">
                    <select class="form-select form-select-sm status-select" aria-label="Статус заявки: ${escapeHtml(item.name)}">${options}</select>
                </td>
            </tr>
        `).join('');
    }).join('');

    root.innerHTML = `
        <table class="table data-table align-middle" role="table">
            <thead>
                <tr role="row">
                    <th scope="col" role="columnheader">Имя</th>
                    <th scope="col" role="columnheader">Контакт</th>
                    <th scope="col" role="columnheader">Сообщение</th>
                    <th scope="col" role="columnheader">Создана</th>
                    <th scope="col" role="columnheader">Статус</th>
                </tr>
            </thead>
            <tbody>${rows}</tbody>
        </table>
        <nav class="table-footer" aria-label="Страницы списка заявок">
            <span>Всего заявок: ${data.count}</span>
            <div class="btn-group">
                <button type="button" class="btn btn-outline-secondary btn-sm" id="prev-page" ${data.previous ? '' : 'disabled'}>Назад</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" id="next-page" ${data.next ? '' : 'disabled'}>Вперёд</button>
            </div>
        </nav>
    `;

    const itemsById = new Map(items.map(item => [item.id, item]));
    root.querySelectorAll('tr[data-id]').forEach(row => {
        const item = itemsById.get(Number(row.dataset.id));
        const select = row.querySelector('.status-select');
        select.value = item.status;
        select.dataset.previousValue = item.status;
        select.addEventListener('change', onStatusChange);
    });

    if (data.previous) {
        document.getElementById('prev-page').addEventListener('click', () => loadConsultations(data.previous));
    }
    if (data.next) {
        document.getElementById('next-page').addEventListener('click', () => loadConsultations(data.next));
    }
}

async function onStatusChange(event) {
    const select = event.target;
    const row = select.closest('tr');
    const id = row.dataset.id;
    const previousValue = select.dataset.previousValue;

    const response = await fetch(`/api/v1/consultations/${id}/`, {
        method: 'PATCH',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCookie('csrftoken'),
        },
        body: JSON.stringify({status: select.value}),
    });

    if (!response.ok) {
        alert('Не удалось обновить статус.');
        select.value = previousValue;
        return;
    }

    select.dataset.previousValue = select.value;
}

loadConsultations('/api/v1/consultations/?limit={{ page_size }}');
</script>
{% endblock %}
