# Без отдельного frontend-контейнера: весь сайт,
# включая статику admin/DRF, рендерит сам Django, поэтому /static/ и /media/
# отдаются напрямую из общих с backend volume, а всё остальное проксируется.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 20M;

    location /static/ {
        alias /static/;
    }

    location /media/ {
        alias /media/;
    }

    location / {
        # Имя контейнера, а не сервиса: в сети proxy есть и другие backend.
        proxy_pass http://psycharm-backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        # Заголовки, не упомянутые здесь, nginx пробрасывает как есть, а Caddy
        # X-Real-IP не трогает - без явной замены это был бы полностью
        # клиентский заголовок с "авторитетным" именем.
        proxy_set_header X-Real-IP "";
    }
}
