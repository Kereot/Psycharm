name: Main PsyHelper workflow

on: push

jobs:

  backend_tests_flake8:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: dummy-key-for-ci-only
      DEBUG: 'True'

    steps:
      - name: Check out code
        uses: actions/checkout@v3
      - name: Set up Python '3.13'
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test with flake8
        working-directory: backend
        run: |
          python -m flake8 .
      - name: Run tests
        working-directory: backend
        run: |
          python manage.py test

  build_backend_and_push_to_docker_hub:
    name: Push backend Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: backend_tests_flake8
    if: github.ref_name == 'master'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./backend/
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/psyhelper-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/psyhelper-backend:${{ github.sha }}

  build_proxy_and_push_to_docker_hub:
    name: Push proxy Docker image to DockerHub
    runs-on: ubuntu-latest
    needs: backend_tests_flake8
    if: github.ref_name == 'master'
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to Docker
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Push to DockerHub
        uses: docker/build-push-action@v4
        with:
          context: ./infra/
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/psyhelper-proxy:latest
            ${{ secrets.DOCKER_USERNAME }}/psyhelper-proxy:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build_backend_and_push_to_docker_hub
      - build_proxy_and_push_to_docker_hub
    if: github.ref_name == 'master'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
      - name: Copy docker-compose.yml via ssh
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.yml'
          target: 'psyhelper'
      - name: Executing remote ssh commands to deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd psyhelper
            sudo docker compose -f docker-compose.yml pull
            sudo docker compose -f docker-compose.yml down
            sudo docker compose -f docker-compose.yml up -d
            # migrate/createcachetable/collectstatic не нужны отдельным шагом -
            # entrypoint.sh уже прогоняет их при каждом старте backend-контейнера.

  send_message:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref_name == 'master'
    steps:
      - name: Send message
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Деплой проекта PsyHelper успешно выполнен!
            Пользователь: ${{ github.actor }}
            Сообщение: ${{ github.event.commits[0].message || 'без сообщения.'}}
